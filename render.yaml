services:
  - type: web
    name: hemline
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.23.2
      - key: WORKER_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: NEATLOGS_API_KEY
        sync: false
      - key: PUBLIC_DEMO_ENABLED
        value: "false"
      - key: APP_BASE_URL
        sync: false
      - key: NEXT_PUBLIC_TURNSTILE_SITE_KEY
        sync: false
      - key: TURNSTILE_SECRET_KEY
        sync: false
      - key: OPENAI_MODEL
        value: claude-sonnet-4.6
      - key: OPENAI_BASE_URL
        sync: false
      - key: MODEL_API
        value: chat
      - key: MODEL_INPUT_USD_PER_MILLION
        value: "3.3"
      - key: MODEL_OUTPUT_USD_PER_MILLION
        value: "16.5"
